name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Download PocketBase
        run: |
          PB_VERSION=$(curl -fsSL https://api.github.com/repos/pocketbase/pocketbase/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "Testing against PocketBase v$PB_VERSION"
          curl -fsSL -o /tmp/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q -o /tmp/pb.zip -d /tmp/pb

      - name: Start PocketBase
        run: |
          mkdir -p /tmp/pb_data
          /tmp/pb/pocketbase serve --http 127.0.0.1:8090 --dir /tmp/pb_data > /tmp/pb.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8090/api/health

      - name: Create superuser
        run: /tmp/pb/pocketbase superuser upsert admin@test.com password123 --dir /tmp/pb_data

      - name: Run tests
        run: bundle exec rake test
        env:
          POCKETBASE_URL: http://127.0.0.1:8090
